name: dev-workflow
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
concurrency:
  group: dev-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: yarn test-ci
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'yarn'
      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      - run: yarn webpack-prod
        env:
          DEBUG_ON: false
      - run: yarn check-build-performance
      - run: mkdir -p logs
      - run: yarn serve > logs/serve.log 2> logs/serve.err.log &
      - name: Select specs for shard
        id: specs
        run: |
          # Balanced by measured per-spec runtime (cypress/spec-timings.json). The script
          # enumerates specs itself, so a new spec lands in a shard without editing this file.
          SPECS=$(node scripts/plan_cypress_shards.js --index ${{ matrix.shard }} --total 5)
          if [ -z "$SPECS" ]; then
            echo "no specs enumerated for shard '${{ matrix.shard }}'" >&2
            exit 1
          fi
          echo "shard '${{ matrix.shard }}' specs ($(echo "$SPECS" | tr ',' '\n' | wc -l)):"
          echo "$SPECS" | tr ',' '\n'
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
      - run: yarn cy-run-ci --spec "${{ steps.specs.outputs.specs }}"
      - uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: cypress-debug-artifacts-${{ matrix.shard }}
          path: |
            cypress/screenshots/
            logs/
          if-no-files-found: warn
      - name: Save Cypress binary cache
        if: ${{ always() && steps.cypress-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
