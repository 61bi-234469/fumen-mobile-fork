    <style>
        html {
            height: 100%;
        }

        body {
            height: 100%;
            overflow: hidden;
        }

        .top-toast {
            position: fixed;
            top: 0;
            right: 0;
            white-space: nowrap;
        }

        /*
         * Tree node delete toast: bottom center, above the bottom toolbar. The
         * `bottom` value is set inline per screen. Kept click-through so it never
         * steals taps from the tree node buttons underneath.
         */
        .tree-delete-toast {
            position: fixed;
            /* Materialize animates `top` to 0 on show; with `bottom` set inline that
               would stretch the toast over the whole screen height. */
            top: auto !important;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            /* Wide enough that the common message stays on one line, narrow enough
               to keep clear of the screen edges. */
            min-width: min(330px, calc(100% - 24px));
            max-width: calc(100% - 24px);
            margin-top: 0;
            border-radius: 4px;
            pointer-events: none;
        }

        .tree-delete-toast .toast-action {
            pointer-events: auto;
        }

        /* Floating corner controls (list/tree views) */
        .corner-glass {
            background-color: rgba(255, 255, 255, 0.86);
            -webkit-backdrop-filter: blur(14px) saturate(1.6);
            backdrop-filter: blur(14px) saturate(1.6);
            border: 1px solid rgba(148, 163, 184, 0.25);
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.14), 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        .corner-btn {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
        }

        .corner-btn:active:not(:disabled) {
            transform: scale(0.9);
            background-color: rgba(203, 213, 225, 0.55);
        }

        @media (hover: hover) {
            .corner-btn:hover:not(:disabled) {
                background-color: rgba(226, 232, 240, 0.75);
            }
        }

        .corner-press {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .corner-press:active {
            transform: scale(0.97);
        }

        .corner-fab {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .corner-fab:active {
            transform: scale(0.92);
        }

        .editor-control {
            -webkit-tap-highlight-color: transparent;
        }

        .editor-context-tray {
            scrollbar-color: rgba(100, 116, 139, 0.58) transparent;
            scrollbar-width: thin;
        }

        .editor-context-tray::-webkit-scrollbar {
            height: 4px;
        }

        .editor-context-tray::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-context-tray::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.58);
            border-radius: 999px;
        }

        .editor-context-tray:hover::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.76);
        }

        .editor-context-tray--compact {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .editor-context-tray--compact::-webkit-scrollbar {
            display: none;
        }

        .editor-control:active:not(:disabled) {
            background: #eceff1 !important;
        }

        .editor-control:focus-visible {
            outline: 2px solid #42a5f5;
            outline-offset: -3px;
        }

        @media (hover: hover) {
            .corner-fab:hover {
                filter: brightness(1.08);
            }
        }
